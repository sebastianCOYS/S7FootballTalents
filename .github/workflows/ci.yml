name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Build frontend & check backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run backend tests
        run: npm test --prefix backend

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://sebastian7.org/s7api

      - name: Check backend syntax
        run: find backend -name "*.js" -print0 | xargs -0 -n1 node --check
